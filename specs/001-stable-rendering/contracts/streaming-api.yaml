openapi: 3.0.3
info:
  title: Stable Rendering & Streaming API
  description: API contracts for optimized streaming and render performance
  version: 1.0.0
  contact:
    name: Suna Development Team

servers:
  - url: http://localhost:8000
    description: Local development server

paths:
  /render-performance/metrics:
    post:
      summary: Report Render Performance Metrics
      description: |
        Custom endpoint for frontend to report render performance metrics
        for debugging and optimization. Useful for monitoring excessive renders,
        component performance, and error boundary triggers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenderMetrics'
      responses:
        '200':
          description: Metrics recorded successfully
        '400':
          description: Invalid metrics data

  /debug/streaming-events:
    post:
      summary: Report Streaming Event for Debugging
      description: |
        Custom debug endpoint for frontend to report streaming-related events
        (errors, retries, timeouts) for analysis and troubleshooting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamingDebugEvent'
      responses:
        '200':
          description: Event recorded successfully
        '400':
          description: Invalid event data

components:
  schemas:
    RenderMetrics:
      type: object
      required:
        - component_name
        - render_count
        - timestamp
      properties:
        component_name:
          type: string
          description: React component name
        render_count:
          type: integer
          minimum: 0
        render_duration:
          type: number
          description: Render duration in milliseconds
        timestamp:
          type: string
          format: date-time
        thread_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        warning_threshold_exceeded:
          type: boolean
        error_threshold_exceeded:
          type: boolean
        throttled:
          type: boolean

    StreamingDebugEvent:
      type: object
      required:
        - event_type
        - timestamp
      properties:
        event_type:
          type: string
          enum: [retry, timeout, error, reconnect, malformed_response]
          description: Type of streaming event
        timestamp:
          type: string
          format: date-time
        thread_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        retry_count:
          type: integer
          minimum: 0
          maximum: 10
        error_message:
          type: string
        error_details:
          type: object
          description: Additional error context
        duration_ms:
          type: integer
          description: Duration of event or operation

    ToolCallData:
      type: object
      required:
        - id
        - name
        - status
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Tool function name
        arguments:
          type: object
          description: Tool arguments as JSON object
        status:
          type: string
          enum: [started, running, completed, failed, malformed]
        result:
          type: object
          description: Tool execution result
        error:
          type: string
          description: Error message if failed
        is_malformed:
          type: boolean
          description: Whether XML parsing detected malformation
        malformation_details:
          type: object
          description: Details about parsing issues
        render_safe:
          type: boolean
          description: Whether safe to render without error boundary
        start_timestamp:
          type: string
          format: date-time
        end_timestamp:
          type: string
          format: date-time


    ErrorBoundaryEvent:
      type: object
      required:
        - component_name
        - error_message
        - timestamp
      properties:
        component_name:
          type: string
        error_message:
          type: string
        error_stack:
          type: string
        component_stack:
          type: string
        timestamp:
          type: string
          format: date-time
        thread_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        recovery_action:
          type: string
          enum: [retry, fallback, reset]

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

security:
  - BearerAuth: []
