# ============================================================================
# SUNA DOCKER COMPOSE - LOCAL/PRIVATE SERVER DEVELOPMENT
# ============================================================================
# This Docker Compose file runs Suna services (Backend, Worker, Frontend, Redis)
#
# Quick Start:
#   docker compose up -d --build          # Start all services
#   docker compose down           # Stop all services
#   docker compose logs -f        # View all logs
#
# Access:
#   - Suna Frontend:     http://localhost:9990 ---> Cloudflare Tunnel
#   - Suna Backend API:  http://localhost:8000 ---> Frontend ----> Proxied from Frontend Proxy ----> Backend ----> Supabase
# ============================================================================

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
      - ./backend/services/docker/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    image: ghcr.io/suna-ai/suna-backend:latest
    restart: unless-stopped
    platform: linux/amd64
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
      - ./backend/.env:/app/.env:ro
      - ${APPDATA}/gcloud/application_default_credentials.json:/app/gcloud-credentials.json:ro
    env_file:
      - ./backend/.env
    environment:
      - ENV_MODE=local
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_SSL=False
      # Local AI Model APIs (accessible from Docker containers)
      - OLLAMA_API_BASE=http://host.docker.internal:11434
      - LM_STUDIO_API_BASE=http://host.docker.internal:1234
      # Vertex AI Configuration
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcloud-credentials.json
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    networks:
      - default
      - supabase

  worker:
    image: ghcr.io/suna-ai/suna-backend:latest
    restart: unless-stopped
    platform: linux/amd64
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uv run dramatiq --skip-logging --processes 4 --threads 4 run_agent_background
    volumes:
      - ./backend:/app
      - /app/.venv
      - ./backend/.env:/app/.env:ro
      - ${APPDATA}/gcloud/application_default_credentials.json:/app/gcloud-credentials.json:ro
    environment:
      - ENV_MODE=local
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_SSL=False
      # Local AI Model APIs (accessible from Docker containers)
      - OLLAMA_API_BASE=http://host.docker.internal:11434
      - LM_STUDIO_API_BASE=http://host.docker.internal:1234
      # Vertex AI Configuration
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcloud-credentials.json
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - default
      - supabase

  frontend:
    init: true
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_ENV_MODE=local
        - NEXT_PUBLIC_SUPABASE_URL=https://kong.kortix.syhc.dev/ #http://kong.kortix.syhc.dev/
        - NEXT_PUBLIC_BACKEND_URL=http://backend:8000/api
        - NEXT_PUBLIC_REALTIME_URL=https://kong.kortix.syhc.dev/
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlLWRlbW8iLCJpYXQiOjE2NDE3NjkyMDAsImV4cCI6MTc5OTUzNTYwMH0.3oxoyIq4gsDgKv97f3OU7EPTAOOyXaq_yqci_5kDjTY
    ports:
      - "9990:3000"
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_ENV_MODE=local
      - NEXT_PUBLIC_SUPABASE_URL=https://kong.kortix.syhc.dev/ #http://kong.kortix.syhc.dev/
      - NEXT_PUBLIC_REALTIME_URL=https://kong.kortix.syhc.dev/
      - NEXT_PUBLIC_BACKEND_URL=http://backend:8000/api #Keep local host to main local environment npm run dev cross compatibility. Use Docker compose file to hard code http://backend:8000/api in container environment 
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlLWRlbW8iLCJpYXQiOjE2NDE3NjkyMDAsImV4cCI6MTc5OTUzNTYwMH0.3oxoyIq4gsDgKv97f3OU7EPTAOOyXaq_yqci_5kDjTY
    depends_on:
      - backend
    networks:
      - default
      - supabase

volumes:
  redis_data:

networks:
  default:
    name: suna
  supabase:
    name: supabase
    external: true
