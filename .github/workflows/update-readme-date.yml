name: Update README Date

on:
  push:
    branches:
      - main
      - master
      - dev
      - feature/*
      - fix/*
      - release/*
      - dev/*
      - stable

jobs:
  update-date:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update Date in README
        run: |
          # Get current date in YYYY-MM-DD format
          CURRENT_DATE=$(date +'%Y-%m-%d')
          
          # Replace the date between markers using sed
          # The syntax s/START.*END/START${DATE}END/ looks for the markers and replaces everything between them
          sed -i "s/<!-- DATE_START -->.*<!-- DATE_END -->/<!-- DATE_START -->$CURRENT_DATE<!-- DATE_END -->/" README.md
          
      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if there are changes
          if [[ -n $(git status -s) ]]; then
            git add README.md
            git commit -m "docs: update maintenance date to $CURRENT_DATE"
            git push
          else
            echo "No changes to commit"
          fi
