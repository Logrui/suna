<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Debug - Basic Connection Test</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #3e3e3e;
            border-radius: 5px;
        }
        .log {
            background: #252526;
            padding: 10px;
            margin: 10px 0;
            border-left: 3px solid #007acc;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
        }
        .error { border-left-color: #f48771; }
        .success { border-left-color: #89d185; }
        .info { border-left-color: #75beff; }
        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            border-radius: 3px;
        }
        button:hover {
            background: #1177bb;
        }
        input {
            background: #3c3c3c;
            border: 1px solid #3e3e3e;
            color: #d4d4d4;
            padding: 8px;
            width: 600px;
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <h1>🔌 WebSocket Connection Debugger</h1>
    <p>This tool tests WebSocket connections to your Supabase Realtime endpoint.</p>

    <div class="test-section">
        <h2>Test Configuration</h2>
        <div>
            <label>WebSocket URL:</label><br>
            <input type="text" id="wsUrl" value="wss://kong.kortix.syhc.dev/realtime/v1/websocket">
        </div>
        <div>
            <label>API Key:</label><br>
            <input type="text" id="apiKey" value="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlLWRlbW8iLCJpYXQiOjE2NDE3NjkyMDAsImV4cCI6MTc5OTUzNTYwMH0.3oxoyIq4gsDgKv97f3OU7EPTAOOyXaq_yqci_5kDjTY">
        </div>
        <button onclick="testBasicConnection()">🧪 Test Basic Connection</button>
        <button onclick="testWithParams()">🧪 Test With Full Params</button>
        <button onclick="clearLogs()">🗑️ Clear Logs</button>
    </div>

    <div class="test-section">
        <h2>Connection Logs</h2>
        <div id="logs" class="log"></div>
    </div>

    <div class="test-section">
        <h2>Connection Status</h2>
        <div id="status" class="log info">
            Ready to test. Click a button above to start.
        </div>
    </div>

    <script>
        let ws = null;
        let connectionAttempt = 0;

        function log(message, type = 'info') {
            const logsDiv = document.getElementById('logs');
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = `log ${type}`;
            logEntry.innerHTML = `<strong>[${timestamp}]</strong> ${message}`;
            logsDiv.appendChild(logEntry);
            logsDiv.scrollTop = logsDiv.scrollHeight;
            console.log(`[${timestamp}] ${message}`);
        }

        function updateStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            statusDiv.className = `log ${type}`;
            statusDiv.textContent = message;
        }

        function clearLogs() {
            document.getElementById('logs').innerHTML = '';
            log('Logs cleared', 'info');
        }

        function closeExistingConnection() {
            if (ws) {
                ws.close();
                ws = null;
                log('Closed existing connection', 'info');
            }
        }

        function testBasicConnection() {
            closeExistingConnection();
            connectionAttempt++;
            
            const baseUrl = document.getElementById('wsUrl').value;
            const apiKey = document.getElementById('apiKey').value;
            const fullUrl = `${baseUrl}?apikey=${apiKey}&vsn=1.0.0`;

            log(`<strong>Test #${connectionAttempt}: Basic Connection</strong>`, 'info');
            log(`URL: ${fullUrl}`, 'info');
            
            updateStatus('Attempting to connect...', 'info');

            try {
                ws = new WebSocket(fullUrl);
                
                ws.onopen = (event) => {
                    log('✅ WebSocket OPENED successfully!', 'success');
                    updateStatus('✅ Connected!', 'success');
                    log(`ReadyState: ${ws.readyState} (OPEN)`, 'success');
                    
                    // Send a ping
                    setTimeout(() => {
                        if (ws && ws.readyState === WebSocket.OPEN) {
                            log('Sending heartbeat...', 'info');
                            ws.send(JSON.stringify({
                                topic: "phoenix",
                                event: "heartbeat",
                                payload: {},
                                ref: "1"
                            }));
                        }
                    }, 1000);
                };

                ws.onmessage = (event) => {
                    log(`📨 Message received: ${event.data}`, 'success');
                    try {
                        const data = JSON.parse(event.data);
                        log(`Parsed: ${JSON.stringify(data, null, 2)}`, 'info');
                    } catch (e) {
                        log(`Could not parse message as JSON`, 'error');
                    }
                };

                ws.onerror = (event) => {
                    log(`❌ WebSocket ERROR occurred!`, 'error');
                    log(`Error event: ${JSON.stringify(event, null, 2)}`, 'error');
                    updateStatus('❌ Connection error', 'error');
                    
                    // Log detailed error info
                    console.error('WebSocket error details:', event);
                };

                ws.onclose = (event) => {
                    log(`🔌 WebSocket CLOSED`, 'error');
                    log(`Code: ${event.code}`, 'error');
                    log(`Reason: ${event.reason || '(no reason provided)'}`, 'error');
                    log(`Clean: ${event.wasClean}`, 'error');
                    updateStatus(`❌ Connection closed (code: ${event.code})`, 'error');
                    
                    // Decode close codes
                    const closeReasons = {
                        1000: 'Normal closure',
                        1001: 'Going away',
                        1002: 'Protocol error',
                        1003: 'Unsupported data',
                        1006: 'Abnormal closure (no status code)',
                        1007: 'Invalid frame payload data',
                        1008: 'Policy violation',
                        1009: 'Message too big',
                        1010: 'Missing extension',
                        1011: 'Internal server error',
                        1015: 'TLS handshake failed'
                    };
                    
                    log(`Close code meaning: ${closeReasons[event.code] || 'Unknown'}`, 'error');
                };

            } catch (error) {
                log(`❌ Exception during WebSocket creation: ${error.message}`, 'error');
                log(`Stack: ${error.stack}`, 'error');
                updateStatus('❌ Failed to create WebSocket', 'error');
            }
        }

        function testWithParams() {
            closeExistingConnection();
            connectionAttempt++;
            
            const baseUrl = document.getElementById('wsUrl').value;
            const apiKey = document.getElementById('apiKey').value;
            const fullUrl = `${baseUrl}?apikey=${apiKey}&eventsPerSecond=1000&vsn=1.0.0`;

            log(`<strong>Test #${connectionAttempt}: Full Parameters</strong>`, 'info');
            log(`URL: ${fullUrl}`, 'info');
            log(`Parameters: apikey, eventsPerSecond=1000, vsn=1.0.0`, 'info');
            
            updateStatus('Attempting to connect with full params...', 'info');

            try {
                ws = new WebSocket(fullUrl);
                
                ws.onopen = (event) => {
                    log('✅ WebSocket OPENED successfully!', 'success');
                    updateStatus('✅ Connected with full params!', 'success');
                    log(`ReadyState: ${ws.readyState} (OPEN)`, 'success');
                };

                ws.onmessage = (event) => {
                    log(`📨 Message: ${event.data}`, 'success');
                };

                ws.onerror = (event) => {
                    log(`❌ WebSocket ERROR occurred!`, 'error');
                    updateStatus('❌ Connection error', 'error');
                    console.error('WebSocket error:', event);
                };

                ws.onclose = (event) => {
                    log(`🔌 WebSocket CLOSED - Code: ${event.code}, Reason: ${event.reason || '(none)'}`, 'error');
                    updateStatus(`❌ Closed (code: ${event.code})`, 'error');
                };

            } catch (error) {
                log(`❌ Exception: ${error.message}`, 'error');
                updateStatus('❌ Failed', 'error');
            }
        }

        // Auto-run basic test on load
        window.addEventListener('load', () => {
            log('WebSocket Debugger loaded. Ready for testing.', 'info');
        });
    </script>
</body>
</html>
