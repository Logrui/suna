<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Debug - HTTP vs HTTPS Port Test</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .test-section {
            padding: 15px;
            border: 1px solid #3e3e3e;
            border-radius: 5px;
        }
        .log {
            background: #252526;
            padding: 10px;
            margin: 10px 0;
            font-size: 11px;
            max-height: 300px;
            overflow-y: auto;
        }
        .error { color: #f48771; }
        .success { color: #89d185; }
        .info { color: #75beff; }
        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            border-radius: 3px;
            width: 100%;
        }
        button:hover {
            background: #1177bb;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 3px;
            text-align: center;
            font-weight: bold;
        }
        .status.pending { background: #3e3e3e; }
        .status.success { background: #1e5b1e; }
        .status.error { background: #5b1e1e; }
    </style>
</head>
<body>
    <h1>🔌 WebSocket Port Comparison Test</h1>
    <p>Testing HTTP port (8888) vs HTTPS port (8445) through Cloudflare Tunnel</p>

    <div class="container">
        <!-- HTTP Port Test -->
        <div class="test-section">
            <h2>🔓 HTTP Port (8888)</h2>
            <div id="status-http" class="status pending">Ready to test</div>
            <button onclick="testHttpPort()">Test via kortix.syhc.dev</button>
            <button onclick="testHttpPortDirect()">Test Direct (localhost)</button>
            <h3>Logs:</h3>
            <div id="logs-http" class="log"></div>
        </div>

        <!-- HTTPS Port Test -->
        <div class="test-section">
            <h2>🔒 HTTPS Port (8445)</h2>
            <div id="status-https" class="status pending">Ready to test</div>
            <button onclick="testHttpsPort()">Test via kong.kortix.syhc.dev</button>
            <button onclick="testHttpsPortDirect()">Test Direct (localhost)</button>
            <h3>Logs:</h3>
            <div id="logs-https" class="log"></div>
        </div>
    </div>

    <div class="test-section" style="margin-top: 20px;">
        <h2>📊 Test Results Summary</h2>
        <div id="summary" class="log">
            Click the test buttons above to compare results.
        </div>
    </div>

    <script>
        const API_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlLWRlbW8iLCJpYXQiOjE2NDE3NjkyMDAsImV4cCI6MTc5OTUzNTYwMH0.3oxoyIq4gsDgKv97f3OU7EPTAOOyXaq_yqci_5kDjTY';
        
        let wsHttp = null;
        let wsHttps = null;

        function log(type, message, level = 'info') {
            const logsDiv = document.getElementById(`logs-${type}`);
            const timestamp = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = level;
            entry.textContent = `[${timestamp}] ${message}`;
            logsDiv.appendChild(entry);
            logsDiv.scrollTop = logsDiv.scrollHeight;
        }

        function updateStatus(type, message, state) {
            const statusDiv = document.getElementById(`status-${type}`);
            statusDiv.textContent = message;
            statusDiv.className = `status ${state}`;
        }

        function updateSummary(message) {
            const summaryDiv = document.getElementById('summary');
            const timestamp = new Date().toLocaleTimeString();
            summaryDiv.innerHTML += `<div>[${timestamp}] ${message}</div>`;
        }

        function testWebSocket(type, url, label) {
            if (type === 'http' && wsHttp) wsHttp.close();
            if (type === 'https' && wsHttps) wsHttps.close();

            const fullUrl = `${url}?apikey=${API_KEY}&vsn=1.0.0`;
            log(type, `Testing: ${label}`, 'info');
            log(type, `URL: ${fullUrl}`, 'info');
            updateStatus(type, 'Connecting...', 'pending');

            try {
                const ws = new WebSocket(fullUrl);
                if (type === 'http') wsHttp = ws;
                if (type === 'https') wsHttps = ws;

                const startTime = Date.now();

                ws.onopen = () => {
                    const duration = Date.now() - startTime;
                    log(type, `✅ Connected in ${duration}ms`, 'success');
                    updateStatus(type, '✅ Connected', 'success');
                    updateSummary(`✅ ${label} - Connected in ${duration}ms`);
                };

                ws.onerror = (event) => {
                    log(type, `❌ Error occurred`, 'error');
                    updateStatus(type, '❌ Error', 'error');
                    updateSummary(`❌ ${label} - Connection failed`);
                    console.error(`${label} error:`, event);
                };

                ws.onclose = (event) => {
                    log(type, `🔌 Closed - Code: ${event.code}`, 'error');
                    log(type, `Reason: ${event.reason || '(none)'}`, 'error');
                    
                    const reasons = {
                        1006: 'Abnormal closure',
                        1015: 'TLS handshake failed'
                    };
                    
                    if (event.code === 1006) {
                        updateSummary(`❌ ${label} - ${reasons[event.code]} (likely network/proxy issue)`);
                    } else if (event.code === 1015) {
                        updateSummary(`❌ ${label} - ${reasons[event.code]} (SSL/TLS problem)`);
                    } else {
                        updateSummary(`❌ ${label} - Closed with code ${event.code}`);
                    }
                    
                    updateStatus(type, `❌ Closed (${event.code})`, 'error');
                };

                ws.onmessage = (event) => {
                    log(type, `📨 Message: ${event.data}`, 'success');
                };

            } catch (error) {
                log(type, `❌ Exception: ${error.message}`, 'error');
                updateStatus(type, '❌ Failed', 'error');
                updateSummary(`❌ ${label} - Exception: ${error.message}`);
            }
        }

        // HTTP Port Tests
        function testHttpPort() {
            testWebSocket('http', 'wss://kortix.syhc.dev/realtime/v1/websocket', 'HTTP via kortix.syhc.dev');
        }

        function testHttpPortDirect() {
            testWebSocket('http', 'ws://localhost:8888/realtime/v1/websocket', 'HTTP Direct (localhost:8888)');
        }

        // HTTPS Port Tests
        function testHttpsPort() {
            testWebSocket('https', 'wss://kong.kortix.syhc.dev/realtime/v1/websocket', 'HTTPS via kong.kortix.syhc.dev');
        }

        function testHttpsPortDirect() {
            testWebSocket('https', 'wss://localhost:8445/realtime/v1/websocket', 'HTTPS Direct (localhost:8445)');
        }
    </script>
</body>
</html>
