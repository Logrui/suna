<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kortix AI Browser Operator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen,
        Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
    }

    .container {
      padding: 20px;
      background: white;
      min-height: 100vh;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 2px solid #f0f0f0;
    }

    .logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 18px;
    }

    .title {
      flex: 1;
    }

    .title h1 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .title p {
      font-size: 12px;
      color: #999;
    }

    .status-section {
      margin-bottom: 20px;
    }

    .status-label {
      font-size: 12px;
      font-weight: 600;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #f8f9fa;
      border-radius: 6px;
      margin-bottom: 8px;
      font-size: 13px;
    }

    .status-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #999;
    }

    .status-indicator.active {
      background: #4caf50;
    }

    .status-indicator.error {
      background: #f44336;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: #f8f9fa;
      padding: 12px;
      border-radius: 6px;
      text-align: center;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 600;
      color: #667eea;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 11px;
      color: #999;
      text-transform: uppercase;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }

    .btn-secondary:hover {
      background: #e0e0e0;
    }

    .history {
      background: #f8f9fa;
      border-radius: 6px;
      padding: 12px;
      max-height: 200px;
      overflow-y: auto;
    }

    .history-item {
      font-size: 11px;
      padding: 6px 0;
      border-bottom: 1px solid #eee;
      color: #666;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .history-empty {
      font-size: 12px;
      color: #999;
      text-align: center;
      padding: 20px;
    }

    .footer {
      font-size: 11px;
      color: #999;
      text-align: center;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #f0f0f0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">K</div>
      <div class="title">
        <h1>Kortix Browser</h1>
        <p>AI Agent Control</p>
      </div>
    </div>

    <div class="status-section">
      <div class="status-label">Status</div>
      <div class="status-item">
        <div class="status-indicator active" id="statusIndicator"></div>
        <span id="statusText">Listening for commands</span>
      </div>
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-value" id="commandCount">0</div>
        <div class="stat-label">Commands</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="extractionCount">0</div>
        <div class="stat-label">Extractions</div>
      </div>
    </div>

    <div class="actions">
      <button class="btn-primary" id="clearHistoryBtn">Clear History</button>
      <button class="btn-secondary" id="settingsBtn">Settings</button>
    </div>

    <div class="status-section">
      <div class="status-label">Recent Activity</div>
      <div class="history" id="history">
        <div class="history-empty">No activity yet</div>
      </div>
    </div>

    <div class="footer">
      <p>Kortix AI Browser Operator v1.0.0</p>
      <p>Ready to assist</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
