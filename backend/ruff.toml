[lint]
# Only check for syntax errors and indentation issues
# E9 = Runtime errors (syntax, indentation)
# F63 = Invalid syntax
# F7 = Syntax errors
select = ["E9", "F63", "F7"]

# Ignore all other rules
ignore = []

[format]
# Optional: configure auto-formatting
indent-style = "space"
quote-style = "double"
